<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generate a Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Generate a <span class="green-text">random password</span></h1>
      <p>Never use an insecure password again.</p>

      <div class="inputs-container">
        <div><button class="btn btn-primary" id="generate-btn">Generate passwords</button></div>

        <form>
          <div class="input-container">
            <label for="input-el" style="display: block">Length of password:</label>
            <input type="number" class="input-el" id="length-input" value="8" />
          </div>
        </form>
      </div>

      <div class="outputs-container">
        <div class="output-container">
          <div class="output-element" id="password-1"></div>
          <button class="btn-secondary" id="copy-btn-1">Copy to clipboard</button>
        </div>

        <div class="output-container">
          <div class="output-element" id="password-2"></div>
          <button class="btn-secondary" id="copy-btn-2">Copy to clipboard</button>
        </div>
      </div>
      <p id="alert-el" style="margin-top: 2rem; color: #697d9b"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
